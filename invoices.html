<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Management - FAB STEEL Invoice System</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/invoice-template.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/print.css">
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <!-- MAIN CONTAINER -->
    <div class="app-main">
      <!-- NAVBAR -->
      <header class="app-navbar" id="app-navbar"></header>

      <!-- CONTENT -->
      <main class="app-content">
        <!-- Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
          <div>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-1 small">
                <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Invoices</li>
              </ol>
            </nav>
            <h3 class="fw-bold mb-0">Invoice Management</h3>
            <p class="text-muted small mb-0">Search, filter, track payments, duplicate, and export invoices</p>
          </div>
          <div class="d-flex gap-2 mt-2 mt-sm-0">
            <button class="btn btn-outline-secondary btn-sm" onclick="InvoicesManager.exportAllListCsv()">
              <i class="bi bi-file-earmark-spreadsheet me-1"></i> Export List CSV
            </button>
            <a href="create-invoice.html" class="btn btn-primary btn-sm d-flex align-items-center gap-1 shadow-sm">
              <i class="bi bi-plus-lg"></i>
              <span>Create Invoice</span>
            </a>
          </div>
        </div>

        <!-- TABS NAV -->
        <ul class="nav nav-pills mb-3 border-bottom pb-2">
          <li class="nav-item">
            <button class="nav-link invoice-tab-btn active" data-status="all">
              All Invoices <span class="badge bg-secondary ms-1" id="count-all">0</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link invoice-tab-btn" data-status="paid">
              Paid <span class="badge bg-success ms-1" id="count-paid">0</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link invoice-tab-btn" data-status="partially paid">
              Partially Paid <span class="badge bg-warning text-dark ms-1" id="count-partially-paid">0</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link invoice-tab-btn" data-status="sent">
              Sent <span class="badge bg-info ms-1" id="count-sent">0</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link invoice-tab-btn" data-status="overdue">
              Overdue <span class="badge bg-danger ms-1" id="count-overdue">0</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link invoice-tab-btn" data-status="draft">
              Draft <span class="badge bg-light text-dark border ms-1" id="count-draft">0</span>
            </button>
          </li>
        </ul>

        <!-- FILTER BAR -->
        <div class="card p-3 mb-4">
          <div class="row g-3">
            <div class="col-md-3">
              <div class="input-group input-group-sm">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="filter-search" class="form-control" placeholder="Search by number, client, PO..." />
              </div>
            </div>
            <div class="col-md-3">
              <select id="filter-client" class="form-select form-select-sm">
                <!-- Loaded dynamically -->
              </select>
            </div>
            <div class="col-md-2">
              <input type="date" id="filter-start-date" class="form-control form-control-sm" placeholder="Start Date" title="From Date" />
            </div>
            <div class="col-md-2">
              <input type="date" id="filter-end-date" class="form-control form-control-sm" placeholder="End Date" title="To Date" />
            </div>
            <div class="col-md-2">
              <select id="filter-sort" class="form-select form-select-sm">
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
                <option value="amount-desc">Highest Amount</option>
                <option value="amount-asc">Lowest Amount</option>
              </select>
            </div>
          </div>
        </div>

        <!-- INVOICES TABLE -->
        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Invoice No</th>
                  <th>Client Name</th>
                  <th>Date</th>
                  <th>Due Date</th>
                  <th class="text-end">Total Amount</th>
                  <th class="text-end">Paid Amount</th>
                  <th class="text-end">Balance Due</th>
                  <th class="text-center">Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="invoices-table-tbody">
                <!-- Dynamically loaded -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- RECORD PAYMENT MODAL -->
  <div class="modal fade" id="payment-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="record-payment-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold"><i class="bi bi-cash-coin text-success me-2"></i>Record Client Payment</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-2 mb-3 bg-light p-2 rounded border">
              <div class="col-6">
                <small class="text-muted d-block">Invoice No:</small>
                <input type="text" id="pay-invoice-no" class="form-control form-control-sm fw-bold" readonly />
              </div>
              <div class="col-6">
                <small class="text-muted d-block">Total Invoice Value:</small>
                <input type="text" id="pay-grand-total" class="form-control form-control-sm" readonly />
              </div>
              <div class="col-12 mt-2">
                <small class="text-danger fw-bold d-block">Current Balance Due:</small>
                <input type="text" id="pay-balance-due" class="form-control form-control-sm text-danger fw-bold" readonly />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="pay-amount">Payment Amount (₹) *</label>
              <input type="number" step="any" id="pay-amount" class="form-control form-control-sm" required />
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label" for="pay-date">Payment Date *</label>
                <input type="date" id="pay-date" class="form-control form-control-sm" required />
              </div>
              <div class="col-6">
                <label class="form-label" for="pay-method">Payment Method</label>
                <select id="pay-method" class="form-select form-select-sm">
                  <option value="NEFT">NEFT / RTGS</option>
                  <option value="UPI">UPI / Instant Transfer</option>
                  <option value="IMPS">IMPS Immediate</option>
                  <option value="Cheque">Bank Cheque</option>
                  <option value="Cash">Cash</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="pay-ref">Transaction / UTR Reference No</label>
              <input type="text" id="pay-ref" class="form-control form-control-sm" placeholder="e.g. AXISN09812348" />
            </div>

            <div class="mb-3">
              <label class="form-label" for="pay-notes">Payment Notes</label>
              <input type="text" id="pay-notes" class="form-control form-control-sm" placeholder="Installment remarks" />
            </div>

            <div>
              <label class="form-label">Previous Payment Records:</label>
              <div id="payment-history-container">
                <!-- Rendered dynamically -->
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-sm btn-success">
              <i class="bi bi-check-lg me-1"></i> Confirm Payment
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- VENDOR SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <!-- APPLICATION SCRIPTS -->
  <script src="assets/js/default-assets.js"></script>
  <script src="assets/js/excel-template-base64.js"></script>
  <script src="assets/js/default-data.js"></script>
  <script src="assets/js/calculations.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/template-engine.js"></script>
  <script src="assets/js/export-pdf.js"></script>
  <script src="assets/js/export-excel.js"></script>
  <script src="assets/js/export-word.js"></script>
  <script src="assets/js/export-csv.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/invoices-manager.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.init('invoices');
      InvoicesManager.init();
    });
  </script>
</body>
</html>
