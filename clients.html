<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client CRM - FAB STEEL Invoice System</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/invoice-template.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/print.css">
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <!-- MAIN CONTAINER -->
    <div class="app-main">
      <!-- NAVBAR -->
      <header class="app-navbar" id="app-navbar"></header>

      <!-- CONTENT -->
      <main class="app-content">
        <!-- Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
          <div>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-1 small">
                <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Clients</li>
              </ol>
            </nav>
            <h3 class="fw-bold mb-0">Client Directory & Billing CRM</h3>
            <p class="text-muted small mb-0">Manage customer billing accounts, GSTIN, and ledger history</p>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-2 mt-sm-0">
            <button class="btn btn-outline-secondary btn-sm" onclick="ClientsManager.exportClientsCsv()">
              <i class="bi bi-download me-1"></i> Export CSV
            </button>
            <label class="btn btn-outline-secondary btn-sm mb-0">
              <i class="bi bi-upload me-1"></i> Import CSV
              <input type="file" id="client-csv-file-input" accept=".csv" class="d-none" />
            </label>
            <button class="btn btn-primary btn-sm d-flex align-items-center gap-1 shadow-sm" onclick="ClientsManager.openAddModal()">
              <i class="bi bi-person-plus-fill"></i>
              <span>Add Client</span>
            </button>
          </div>
        </div>

        <!-- SEARCH BAR -->
        <div class="card p-3 mb-4">
          <div class="row g-3">
            <div class="col-md-6">
              <div class="input-group input-group-sm">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="client-search" class="form-control" placeholder="Search by client name, company, GSTIN, or state..." />
              </div>
            </div>
          </div>
        </div>

        <!-- CLIENTS TABLE -->
        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>Client / Company</th>
                  <th>GSTIN / PAN</th>
                  <th>Location & Address</th>
                  <th class="text-center">Invoices</th>
                  <th class="text-end">Total Billed</th>
                  <th class="text-end">Outstanding Balance</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="clients-table-tbody">
                <!-- Loaded dynamically -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- ADD / EDIT CLIENT MODAL -->
  <div class="modal fade" id="client-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="client-form">
          <input type="hidden" id="client-id" />
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="client-modal-title">Client Profile</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="modal-client-company">Company Name *</label>
                <input type="text" id="modal-client-company" class="form-control form-control-sm" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="modal-client-contact">Contact Person</label>
                <input type="text" id="modal-client-contact" class="form-control form-control-sm" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="modal-client-email">Email Address</label>
                <input type="email" id="modal-client-email" class="form-control form-control-sm" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="modal-client-phone">Phone Number</label>
                <input type="text" id="modal-client-phone" class="form-control form-control-sm" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="modal-client-gstin">GSTIN (15 Digits)</label>
                <input type="text" id="modal-client-gstin" class="form-control form-control-sm text-uppercase font-monospace" maxlength="15" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="modal-client-pan">PAN Number</label>
                <input type="text" id="modal-client-pan" class="form-control form-control-sm text-uppercase font-monospace" maxlength="10" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="modal-client-state">State</label>
                <input type="text" id="modal-client-state" class="form-control form-control-sm" placeholder="e.g. Gujarat" />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="modal-client-state-code">State Code (2 Digits)</label>
                <input type="text" id="modal-client-state-code" class="form-control form-control-sm font-monospace" maxlength="2" placeholder="e.g. 24" />
              </div>
              <div class="col-12">
                <label class="form-label" for="modal-client-address">Billing Address</label>
                <textarea id="modal-client-address" class="form-control form-control-sm" rows="3" placeholder="Plot, Street, City, State, PIN code"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-sm btn-primary">
              <i class="bi bi-save me-1"></i> Save Client
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- VIEW CLIENT DETAILS & INVOICE HISTORY MODAL -->
  <div class="modal fade" id="client-details-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold"><i class="bi bi-person-badge text-primary me-2"></i>Client Billing Profile</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="client-details-body">
          <!-- Rendered dynamically -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- VENDOR SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- APPLICATION SCRIPTS -->
  <script src="assets/js/default-assets.js"></script>
  <script src="assets/js/default-data.js"></script>
  <script src="assets/js/calculations.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/export-csv.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/clients-manager.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.init('clients');
      ClientsManager.init();
    });
  </script>
</body>
</html>
